[pytest]
# Pytest configuration for Security Labs

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -ra

# Markers for categorizing tests
markers =
    lab1: Tests for Lab 1 (GCD and LCG)
    lab2: Tests for Lab 2 (MD5 Hash)
    lab3: Tests for Lab 3 (RC5 Encryption)
    slow: Tests that take a long time to run
    unit: Unit tests
    integration: Integration tests

# Minimum version
minversion = 6.0

# Console output width
console_output_style = progress

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
# SonarQube Configuration for Security Labs Project

# Project identification
sonar.projectKey=security-labs
sonar.projectName=Security Labs
sonar.projectVersion=1.0

# Project description
sonar.projectDescription=Cryptography and Security Labs Implementation

# Source code location
sonar.sources=backend,frontend/src
sonar.tests=backend/tests

# Python specific settings
sonar.language=py
sonar.python.version=3.11

# Exclude directories
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/htmlcov/**,**/.pytest_cache/**,**/venv/**,**/.venv/**,backend/tests/**,frontend/build/**,frontend/dist/**

# Test coverage settings
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript settings for frontend
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Python linting
sonar.python.pylint.reportPaths=backend/pylint-report.txt
sonar.python.flake8.reportPaths=backend/flake8-report.txt

# Code analysis settings
sonar.issue.ignore.multicriteria=e1,e2

# Ignore specific rules
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# Ignore TODOs and FIXMEs in tests
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/test_*.py